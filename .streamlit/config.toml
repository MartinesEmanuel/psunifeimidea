[server]
maxUploadSize = 10240
maxMessageSize = 10240
# Só este computador acessa o app. Para abrir de outro aparelho da rede,
# troque para "0.0.0.0" somente depois de implementar controles de rede.
address = "localhost"
# Não pergunta e-mail no terminal na primeira execução.
showEmailPrompt = false

[theme]
base = "light"
primaryColor = "#c8102e"

[browser]
gatherUsageStats = false
